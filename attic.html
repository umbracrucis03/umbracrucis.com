<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story's Attic - Umbra Crucis</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #080808;
            background-image: radial-gradient(circle at center, #1a0000 0%, #050505 100%);
            color: #d1b4a3;
            font-family: 'Georgia', serif;
            line-height: 1.6;
            padding-bottom: 40px;
        }

        /* TOP NAVIGATION BAR */
        .navbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 20px 30px;
            position: relative;
            z-index: 100;
        }

        .menu-icon {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 21px;
            cursor: pointer;
        }

        .menu-icon span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #e60000;
            border-radius: 3px;
            box-shadow: 0 0 5px #ff0000;
        }

        .nav-links {
            display: none;
            position: absolute;
            top: 60px;
            right: 30px;
            background-color: rgba(15, 0, 0, 0.95);
            border: 1px solid #660000;
            border-radius: 5px;
            flex-direction: column;
            width: 180px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }

        .nav-links.active {
            display: flex;
        }

        .nav-links a {
            color: #d1b4a3;
            text-decoration: none;
            padding: 12px 20px;
            border-bottom: 1px solid #2a0000;
            font-family: 'Cinzel', serif;
            transition: background 0.2s, color 0.2s;
        }

        .nav-links a:hover {
            background-color: #330000;
            color: #ff4d4d;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 20px auto;
        }

        section {
            background-color: rgba(12, 12, 12, 0.85);
            border: 1px solid #330000;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        h1.page-title {
            font-family: 'Creepster', cursive;
            font-size: 2.8rem;
            color: #e60000;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #990000;
        }

        /* CATEGORY HEADINGS */
        .category-title {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            border-bottom: 2px solid #660000;
            padding-bottom: 8px;
            margin: 30px 0 15px 0;
            letter-spacing: 1px;
        }

        .category-title a {
            transition: color 0.2s;
        }

        .category-title a:hover {
            color: #ff0000 !important;
            text-shadow: 0 0 5px #ff0000;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.85rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- TOP MENU -->
    <nav class="navbar">
        <div class="menu-icon" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="nav-links" id="navMenu">
            <a href="index.html">About Us</a>
            <a href="attic.html">Story's Attic</a>
            <a href="contact.html">Contact Us</a>
        </div>
    </nav>

    <div class="container">
        <section>
            <h1 class="page-title">Story's Attic</h1>

            <!-- 1. ENGLISH SECTION -->
            <div class="category-title">
                <a href="english-tales.html" style="color: #ff4d4d; text-decoration: none;">🇬🇧 English Tales ➔</a>
            </div>

            <!-- 2. HINDI SECTION -->
            <div class="category-title">
                <a href="#" style="color: #ff4d4d; text-decoration: none;">🇮🇳 हिंदी कहानियां (Hindi) ➔</a>
            </div>

            <!-- 3. HINGLISH SECTION -->
            <div class="category-title">
                <a href="#" style="color: #ff4d4d; text-decoration: none;">💬 Hinglish Stories ➔</a>
            </div>

        </section>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 UMBRA CRUCIS. All rights reserved.</p>
    </footer>

    <!-- JAVASCRIPT FOR TOGGLING MENU -->
    <script>
        function toggleMenu() {
            var menu = document.getElementById("navMenu");
            menu.classList.toggle("active");
        }
    </script>

</body>
</html>
